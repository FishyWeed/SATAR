<!doctype html>
<html lang="en-GB" data-theme="night">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#080d0b" />
		<link rel="icon" href="/img/logos/satar-app-icon.svg" type="image/svg+xml" />
		<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/DMSerifDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="/css/satar.css" />
		<!-- The saved theme (day or night) before the first paint, so the page does not flash. -->
		<script>try { var t = localStorage.getItem('satar-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
		<!-- The SATAR design system behaviours (menus, dialogs, password toggles, copy buttons, reveals). -->
		<script src="/js/satar.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
